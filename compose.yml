services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: takehome_db
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d takehome_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:mysecretpassword@db:5432/takehome_db
      SECRET_KEY: 7969048f66cda3dd5030936b93233fba93cb0a066dcf515cd4dd1d14718c9459
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: >
      sh -c "alembic upgrade head &&
      fastapi run --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips '*'"
