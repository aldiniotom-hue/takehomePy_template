version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.14
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: test_takehomePy
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: python -m pip install --upgrade pip && pip install -e .
      - run:
          name: Run tests
          command: pytest

workflows:
  test:
    jobs:
      - test